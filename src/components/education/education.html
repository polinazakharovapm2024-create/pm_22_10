<section class="cv-section cv-section--dark cv-section--education">
  <div class="cv-section__header cv-section__header--with-toggle">
    <h2 class="cv-section__title">EDUCATION</h2>
    <button
      class="btn btn-sm btn-outline-light toggle-btn"
      type="button"
      data-target="educationContent"
    >
      <span class="toggle-icon">▼</span>
    </button>
  </div>

  <div id="educationContent" class="cv-section__content toggle-content">
    <div class="cv-education">
      <div class="cv-education__item">
        <h3 class="cv-education__degree">ENTER YOUR MAJOR</h3>
        <p class="cv-education__school">Name Of Your University</p>
        <span class="cv-education__period">2005 - 2009</span>
      </div>

      <div class="cv-education__item">
        <h3 class="cv-education__degree">ENTER YOUR MAJOR</h3>
        <p class="cv-education__school">Name Of Your University</p>
        <span class="cv-education__period">2009 - 2011</span>
      </div>
    </div>
  </div>
</section>
